<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Young Booth Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#efece6; --border:#e5dfd5;
  --text:#17140f; --muted:#726b60; --faint:#a49b8d;
  --accent:#2E86C9; --accent-ink:#ffffff; --accent-soft:#dceffb;
  --ok:#1f9d55; --danger:#e5484d;
  --shadow-sm:0 1px 2px rgba(20,15,10,.06);
  --shadow:0 2px 6px rgba(20,15,10,.06),0 14px 34px rgba(20,15,10,.10);
  --radius:16px; --radius-sm:10px;
  --disp:"Bricolage Grotesque",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0c0f; --surface:#141519; --surface-2:#1c1e25; --border:#2a2d37;
  --text:#f3f3f6; --muted:#9599a6; --faint:#6a6e7c;
  --accent:#3ba3e6; --accent-ink:#062338; --accent-soft:#12314a;
  --ok:#3fd07f; --danger:#ff6169;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 2px 6px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0b0c0f; --surface:#141519; --surface-2:#1c1e25; --border:#2a2d37;
  --text:#f3f3f6; --muted:#9599a6; --faint:#6a6e7c;
  --accent:#3ba3e6; --accent-ink:#062338; --accent-soft:#12314a;
  --ok:#3fd07f; --danger:#ff6169;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 2px 6px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--border);}
.hdr-in{max-width:1240px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;flex:0 0 auto}
.logo{width:42px;height:42px;flex:0 0 auto}
.logo svg{width:100%;height:100%;display:block}
.brand b{font-family:"Baloo 2",var(--disp);font-weight:800;font-size:19px;
  letter-spacing:.01em;color:var(--accent);line-height:1;display:block}
.brand .tag{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.hdr-spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:999px;padding:7px 14px;
  min-width:0;max-width:280px;flex:1 1 200px;transition:border-color .15s}
.search:focus-within{border-color:var(--accent)}
.search svg{width:15px;height:15px;color:var(--muted);flex:0 0 auto}
.search input{border:0;background:none;outline:none;color:var(--text);width:100%}
.search input::placeholder{color:var(--faint)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);display:grid;place-items:center;flex:0 0 auto;position:relative;
  transition:transform .12s,border-color .15s}
.ibadge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;
  border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  display:grid;place-items:center;font-family:var(--mono);box-shadow:0 0 0 2px var(--bg)}
.iconbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.iconbtn svg{width:18px;height:18px}
.adminchip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  color:var(--accent);border:1px solid var(--accent);border-radius:999px;
  padding:5px 10px;flex:0 0 auto}
.iconbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pvbar{position:sticky;top:calc(63px + env(safe-area-inset-top,0px));z-index:35;
  display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;
  background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600;
  padding:9px 16px;text-align:center}
.pvbar svg{width:16px;height:16px}
.pvbar b{font-weight:800}
.pvbar button{border:1px solid color-mix(in srgb,var(--accent-ink) 45%,transparent);
  color:var(--accent-ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:12px}
.pvbar button:hover{background:color-mix(in srgb,var(--accent-ink) 15%,transparent)}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.hero{padding:32px 0 30px;max-width:900px}
.hero .kick{font-family:var(--mono);font-size:12px;letter-spacing:.22em;
  color:var(--accent);text-transform:uppercase}
.hero h1{font-family:var(--disp);font-weight:800;letter-spacing:-.03em;
  font-size:clamp(34px,7vw,68px);line-height:1.02;margin:14px 0 0;text-wrap:balance}
.hero p{color:var(--muted);font-size:clamp(15px,2vw,18px);margin:16px 0 0;max-width:60ch}
.hero .contact{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}
/* hero motion */
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
@keyframes focusIn{from{opacity:0;filter:blur(16px);transform:translateY(10px) scale(.992);letter-spacing:.05em}
  60%{opacity:1}to{opacity:1;filter:blur(0);transform:none;letter-spacing:normal}}
@keyframes refocus{0%,60%,100%{filter:blur(0);opacity:1}70%{filter:blur(2.6px);opacity:.82}82%{filter:blur(0);opacity:1}}
.hero>.kick,.hero>p,.hero>.contact,.hero>.hero-contacts{
  animation:riseIn .62s cubic-bezier(.22,.61,.36,1) both}
.hero>.kick{animation-delay:.04s}
.hero>p{animation-delay:.24s}
.hero>.contact{animation-delay:.36s}
.hero>.hero-contacts{animation-delay:.46s}
.hero>h1{color:var(--accent);animation:focusIn .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:.13s}
.hero>h1 .hl{color:var(--text);display:inline-block;transition:filter .42s ease,opacity .42s ease;will-change:filter,opacity}
.hero>h1 .hl.swap{filter:blur(10px);opacity:0}
.card.reveal{animation:cardIn .55s cubic-bezier(.22,.61,.36,1) both}
.ahero{animation:riseIn .6s cubic-bezier(.22,.61,.36,1) both}
.actions{animation:riseIn .58s cubic-bezier(.22,.61,.36,1) both .1s}
.photos figure{animation:cardIn .5s cubic-bezier(.22,.61,.36,1) both}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  .hero>h1 .hl{transition:none}.hero>h1 .hl.swap{filter:none;opacity:1}}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;
  background:var(--surface);border:1px solid var(--border);border-radius:999px;
  padding:8px 14px;box-shadow:var(--shadow-sm)}
.pill svg{width:14px;height:14px;color:var(--accent)}
.contacts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero-contacts{margin-top:14px}
.cbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);
  background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;
  font-weight:600;color:var(--text);box-shadow:var(--shadow-sm);
  transition:transform .12s,border-color .15s,color .15s}
.cbtn:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--accent)}
.cbtn svg{width:16px;height:16px;flex:0 0 auto}
.cbtn.io{padding:9px;width:38px;height:38px;justify-content:center}
.fsub{color:var(--muted)}

.sechead{display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;margin:26px 0 18px;flex-wrap:wrap}
.sechead h2{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.02em;margin:0}
.sechead .count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;
  padding:10px 16px;font-weight:600;font-size:14px;border:1px solid var(--border);
  background:var(--surface);transition:transform .12s,border-color .15s,background .15s}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.btn.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ---------- album grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:18px;padding-bottom:60px}
.card{position:relative;border-radius:var(--radius);overflow:hidden;
  background:var(--surface-2);border:1px solid var(--border);
  box-shadow:var(--shadow-sm);transition:transform .18s,box-shadow .18s;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card:hover .cover>*{transform:scale(1.05)}
.cover{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--surface-2)}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.cover .ph{width:100%;height:100%;transition:transform .5s ease}
.card .scrim{position:absolute;inset:0;background:linear-gradient(to top,
  rgba(0,0,0,.78) 0%,rgba(0,0,0,.25) 42%,rgba(0,0,0,0) 68%)}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 15px;color:#fff}
.card .cap h3{font-family:var(--disp);font-weight:700;font-size:17px;margin:0;
  letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.card .cap .meta{font-family:var(--mono);font-size:11px;opacity:.86;margin-top:6px;
  display:flex;flex-wrap:wrap;gap:4px 10px}
.card .badge{position:absolute;top:12px;left:12px;font-family:var(--mono);
  font-size:10px;letter-spacing:.08em;padding:4px 9px;border-radius:999px;
  background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px)}
.card .demo{background:var(--accent);color:var(--accent-ink)}
.card .cnt{position:absolute;top:12px;right:12px;font-family:var(--mono);
  font-size:11px;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.55);
  color:#fff;display:flex;align-items:center;gap:5px;backdrop-filter:blur(4px)}
.card .cnt svg{width:12px;height:12px}

/* placeholder tile */
.ph{position:relative;background:
  linear-gradient(135deg,hsl(var(--h1) 70% 58%),hsl(var(--h2) 72% 46%));
  display:grid;place-items:center}
.ph::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent 0 22%,rgba(255,255,255,.14) 22% 24%);
  mix-blend-mode:overlay}
.ph svg{width:34%;max-width:70px;color:rgba(255,255,255,.85);position:relative;z-index:1}

/* ---------- album view ---------- */
.abar{display:flex;align-items:center;gap:12px;padding:18px 0 4px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);
  font-weight:600;font-size:14px}
.back:hover{color:var(--accent)}
.back svg{width:16px;height:16px}
.ahero{position:relative;border-radius:var(--radius);overflow:hidden;
  margin:14px 0 4px;border:1px solid var(--border);background:var(--surface-2);
  min-height:230px}
.ahero .bg{position:absolute;inset:0}
.ahero .bg img{width:100%;height:100%;object-fit:cover;filter:brightness(.72)}
.ahero .bg .ph{width:100%;height:100%}
.ahero .scr{position:absolute;inset:0;background:linear-gradient(to top,
  rgba(0,0,0,.82),rgba(0,0,0,.15) 70%,rgba(0,0,0,.35))}
.ahero .txt{position:relative;padding:34px 26px 26px;min-height:230px;
  display:flex;flex-direction:column;justify-content:flex-end;color:#fff}
.ahero h1{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;
  font-size:clamp(26px,5vw,46px);line-height:1.05;margin:0;text-wrap:balance;max-width:20ch}
.ahero .meta{font-family:var(--mono);font-size:13px;margin-top:12px;
  display:flex;flex-wrap:wrap;gap:6px 16px;opacity:.92}
.ahero .meta span{display:inline-flex;align-items:center;gap:6px}
.ahero .meta svg{width:14px;height:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding:16px 0 6px}

/* masonry photo grid */
.photos{columns:4 220px;column-gap:14px;padding:8px 0 70px}
.photos figure{break-inside:avoid;margin:0 0 14px;position:relative;
  border-radius:12px;overflow:hidden;background:var(--surface-2);
  border:1px solid var(--border);cursor:zoom-in;box-shadow:var(--shadow-sm)}
.photos figure:hover{border-color:var(--accent)}
.photos img{width:100%;height:auto}
.photos .ph{aspect-ratio:4/5}
.pactions{position:absolute;top:8px;right:8px;display:flex;gap:6px;opacity:0;
  transition:opacity .15s}
.photos figure:hover .pactions{opacity:1}
.pbtn{width:30px;height:30px;border-radius:8px;background:rgba(0,0,0,.62);
  color:#fff;display:grid;place-items:center;backdrop-filter:blur(4px)}
.pbtn:hover{background:var(--accent);color:var(--accent-ink)}
.pbtn.del:hover{background:var(--danger);color:#fff}
.pbtn svg{width:15px;height:15px}
.pcover{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:10px;
  padding:3px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}

/* ---------- reviews ---------- */
.reviews{border-top:1px solid var(--border);margin:8px 0 70px;padding-top:26px}
.rev-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.rev-head h2{font-family:var(--disp);font-weight:700;font-size:22px;margin:0;letter-spacing:-.02em}
.rev-avg{display:flex;align-items:center;gap:10px}
.rev-score{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1}
.rev-cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.star{width:20px;height:20px;fill:var(--border);flex:0 0 auto}
.rev-stars{display:inline-flex;gap:3px}
.rev-stars.sm .star{width:15px;height:15px}
.star.on{fill:#f5b301}
.rev-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;margin-bottom:22px;box-shadow:var(--shadow-sm)}
.rev-flabel{font-weight:600;font-size:14px;margin-bottom:10px}
.rev-form .rev-stars{margin-bottom:14px}
.rev-form .rev-stars .star{width:30px;height:30px;cursor:pointer;transition:transform .1s}
.rev-form .rev-stars .star:hover{transform:scale(1.15)}
.rin{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);outline:none;margin-bottom:10px;font-family:inherit}
.rin:focus{border-color:var(--accent)}
.rta{resize:vertical;min-height:74px}
.rev-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rev-hint{font-size:12px;color:var(--muted)}
.rev-list{display:flex;flex-direction:column;gap:14px}
.rev-item{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface)}
.rev-top{display:flex;align-items:center;gap:10px}
.rev-who{font-weight:600;font-size:14px}
.rev-top .rev-stars{margin-right:auto}
.rev-del{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.rev-del:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.rev-del svg{width:14px;height:14px}
.rev-body{margin:9px 0 0;font-size:14px;color:var(--text);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.rev-date{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--faint)}

/* empty / skeleton */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .big{font-family:var(--disp);font-weight:700;font-size:22px;color:var(--text);margin:0 0 8px}
.sk{border-radius:var(--radius);aspect-ratio:4/5;
  background:linear-gradient(100deg,var(--surface-2) 30%,var(--border) 50%,var(--surface-2) 70%);
  background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

.notice{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 18px;margin:20px 0;color:var(--muted);
  display:flex;gap:12px;align-items:flex-start}
.notice svg{width:20px;height:20px;color:var(--accent);flex:0 0 auto;margin-top:1px}
.notice b{color:var(--text)}

/* ---------- footer ---------- */
.foot{border-top:1px solid var(--border);margin-top:26px;background:var(--surface)}
.foot-grid{max-width:1240px;margin:0 auto;padding:44px 20px 26px;
  display:grid;grid-template-columns:1.5fr 1fr 1.3fr .9fr;gap:34px}
.fcol h4{font-family:var(--disp);font-size:15px;font-weight:700;margin:0 0 16px}
.flogo{display:flex;align-items:center;gap:11px}
.flogomark{width:40px;height:40px;flex:0 0 auto;display:block}
.flogo b{font-family:"Baloo 2",var(--disp);font-weight:800;font-size:18px;
  color:var(--accent);display:block;line-height:1}
.flogo span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.fdesc{color:var(--muted);font-size:13px;line-height:1.65;margin:16px 0 0;max-width:34ch}
.flinks{display:flex;flex-direction:column;gap:11px}
.flinks a{color:var(--muted);font-size:14px;width:fit-content}
.flinks a:hover{color:var(--accent)}
.flines{display:flex;flex-direction:column;gap:12px}
.flines a,.fline{color:var(--muted);font-size:14px;display:inline-flex;align-items:flex-start;
  gap:9px;width:fit-content;line-height:1.4}
.flines a:hover{color:var(--accent)}
.flines svg,.fline svg{width:16px;height:16px;flex:0 0 auto;color:var(--accent);margin-top:1px}
.fsoc{display:flex;flex-wrap:wrap;gap:10px}
.fmuted{color:var(--faint);font-size:13px}
.foot-bar{border-top:1px solid var(--border);max-width:1240px;margin:0 auto;
  padding:16px 20px;color:var(--muted);font-size:13px;display:flex;
  justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.foot-bar .ver{font-family:var(--mono);font-size:11px;color:var(--faint)}
.frow2{display:flex;gap:12px}
.frow2 .field{flex:1;min-width:0}
/* booking CTA + cute form */
.pill-cta{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);cursor:pointer}
.pill-cta svg{color:var(--accent-ink)}
.pill-cta:hover{filter:brightness(1.06);transform:translateY(-1px)}
.bk-hero{text-align:center;margin:-24px -24px 18px;padding:22px 24px 18px;color:#fff;
  border-radius:16px 16px 0 0;
  background:radial-gradient(circle at 14% 32%,rgba(244,194,32,.55) 0 6px,transparent 7px),
    radial-gradient(circle at 82% 26%,rgba(93,180,70,.55) 0 5px,transparent 6px),
    radial-gradient(circle at 66% 74%,rgba(237,125,37,.55) 0 5px,transparent 6px),
    radial-gradient(circle at 30% 78%,rgba(255,255,255,.5) 0 4px,transparent 5px),
    radial-gradient(circle at 90% 62%,rgba(255,255,255,.4) 0 4px,transparent 5px),

<script>
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const isReal=id=>typeof id==='string'&&(/^https?:\/\//.test(id)||/^[0-9a-f]{32}$/.test(id));
const blobUrl=id=>/^https?:\/\//.test(id)?id:'/_blob/'+id;
function hash(str){let h=0;for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))|0;}return Math.abs(h);}
function phStyle(seed){const n=hash(String(seed||'x'));const h1=n%360,h2=(h1+42)%360;
  return `--h1:${h1};--h2:${h2}`;}
const CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
function fmtDate(d){if(!d)return '';const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
  if(m)return `${m[3]}.${m[2]}.${m[1]}`;return d;}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function setProg(p){const e=$('#prog');e.style.transform='scaleX('+p+')';
  if(p>=1)setTimeout(()=>{e.style.transform='scaleX(0)';},400);}

/* ============ theme ============ */
function initTheme(){
  let saved=null;try{saved=localStorage.getItem('pb-theme');}catch(e){}
  if(saved)document.documentElement.dataset.theme=saved;
  paintThemeBtn();
}
function curTheme(){const t=document.documentElement.dataset.theme;
  if(t)return t;return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}
function paintThemeBtn(){
  const dark=curTheme()==='dark';
  $('#themeBtn').innerHTML=dark
    ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>'
    :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
}
$('#themeBtn').onclick=()=>{const next=curTheme()==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  try{localStorage.setItem('pb-theme',next);}catch(e){}paintThemeBtn();};

/* ============ capabilities ============ */
const cap={db:null,assets:null,user:null,downloads:null};
let isAdmin=false, dbReady=false, previewGuest=false, loggedIn=false;
const canAdmin=()=>isAdmin&&!previewGuest;
const LOGIN_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg>';
const LOGOUT_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>';

/* ===================== CẤU HÌNH — điền sau khi tạo Supabase ===================== */
const SUPABASE_URL='https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY='YOUR-ANON-KEY';
const EMAILJS={publicKey:'',serviceId:'',templateId:''}; // (tuỳ chọn) tự gửi email đơn đặt booth
/* =============================================================================== */

const _sb=(window.supabase&&SUPABASE_URL.indexOf('YOUR-')<0)?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
function _row2obj(r){return (r&&r.data)?r.data:{};}
function _obj2row(table,id,obj){
  if(table==='albums')return {id,created_at:obj.createdAt||0,data:obj};
  if(table==='reviews')return {id,album_id:obj.albumId||null,at:obj.at||0,data:obj};
  if(table==='bookings')return {id,at:obj.at||0,data:obj};
  return {id,data:obj};
}
function sbDoc(path){const seg=path.split('/'),table=seg[0],id=seg[1];
  return {
    id:id,
    async get(){if(!_sb)return{id,exists:false,data:()=>undefined};
      const {data}=await _sb.from(table).select('*').eq('id',id).maybeSingle();
      return {id,exists:!!data,data:()=>data?_row2obj(data):undefined};},
    onSnapshot(next,err){if(!_sb){next({id,exists:false,data:()=>undefined});return ()=>{};}
      let alive=true;
      const emit=async()=>{if(!alive)return;const {data,error}=await _sb.from(table).select('*').eq('id',id).maybeSingle();
        if(error){err&&err(error);return;}next({id,exists:!!data,data:()=>data?_row2obj(data):undefined});};
      emit();
      const ch=_sb.channel('d_'+table+'_'+id+'_'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:table,filter:'id=eq.'+id},emit).subscribe();
      const iv=setInterval(emit,20000);
      return ()=>{alive=false;clearInterval(iv);try{_sb.removeChannel(ch);}catch(e){}};},
    async set(obj){if(!_sb)throw new Error('no-config');const {error}=await _sb.from(table).upsert(_obj2row(table,id,obj));if(error)throw error;},
    async update(patch){if(!_sb)throw new Error('no-config');
      const {data}=await _sb.from(table).select('*').eq('id',id).maybeSingle();
      const merged=Object.assign({},_row2obj(data),patch);
      const {error}=await _sb.from(table).upsert(_obj2row(table,id,merged));if(error)throw error;},
    async delete(){if(!_sb)return;await _sb.from(table).delete().eq('id',id);}
  };
}
function sbCol(table){let _f=null;
  const api={
    where(field,op,val){_f={field:field,val:val};return api;},
    orderBy(){return api;},
    doc(id){return sbDoc(table+'/'+(id||(table[0]+Date.now().toString(36)+Math.random().toString(36).slice(2,6))));},
    async add(obj){if(!_sb)throw new Error('no-config');
      const id=obj.id||(Date.now().toString(36)+Math.random().toString(36).slice(2,8));
      const {error}=await _sb.from(table).upsert(_obj2row(table,id,obj));if(error)throw error;return {id};},
    onSnapshot(next,err){if(!_sb){next({docs:[]});return ()=>{};}
      let alive=true;
      const emit=async()=>{if(!alive)return;
        let q=_sb.from(table).select('*');
        if(_f)q=q.eq(_f.field==='albumId'?'album_id':_f.field,_f.val);
        if(table==='albums')q=q.order('created_at',{ascending:false});
        const {data,error}=await q;if(error){err&&err(error);return;}
        next({docs:(data||[]).map(function(r){return {id:r.id,exists:true,data:function(){return _row2obj(r);}};})});};
      emit();
      const ch=_sb.channel('c_'+table+'_'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:table},emit).subscribe();
      const iv=setInterval(emit,20000);
      return ()=>{alive=false;clearInterval(iv);try{_sb.removeChannel(ch);}catch(e){}};}
  };return api;
}

function launchConfetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cv=document.createElement('canvas');
  cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:100';
  cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);
  const ctx=cv.getContext('2d');
  const cols=['#2E86C9','#5DB446','#F4C220','#ED7D25','#ff4d7d','#3aa0e0','#8b5cf6','#2E9BD6'];
  const P=[];for(let i=0;i<140;i++)P.push({x:Math.random()*cv.width,
    y:-20-Math.random()*cv.height*0.35,r:4+Math.random()*6,c:cols[i%cols.length],
    vx:(Math.random()-0.5)*2.4,vy:2+Math.random()*3.2,rot:Math.random()*6,
    vr:(Math.random()-0.5)*0.35,sq:Math.random()<0.5});
  const t0=performance.now();
  (function frame(t){const dt=t-t0;ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.03;p.rot+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,1-dt/2800);
      ctx.fillStyle=p.c;
      if(p.sq)ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
      else{ctx.beginPath();ctx.arc(0,0,p.r/1.6,0,7);ctx.fill();}
      ctx.restore();});
    if(dt<2800)requestAnimationFrame(frame);else cv.remove();
  })(t0);
}

  box.onclick=e=>{const s=e.target.closest('.star');if(!s)return;rating=+s.dataset.v;paint();};

  app.innerHTML=html;
  renderGrid(true);
  startHeroRotator();
}
const HERO_WORDS=['khoảnh khắc','Young Booth'];
const HL_COLORS=Array.from({length:30},(_,i)=>`hsl(${i*12} 72% 53%)`);
let heroRotTimer=null,heroRotI=0,heroColorI=0;
function startHeroRotator(){
  if(heroRotTimer){clearInterval(heroRotTimer);heroRotTimer=null;}
  const hl=$('.hero .hl');if(!hl)return;
  heroRotI=0;heroColorI=0;hl.textContent=HERO_WORDS[0];hl.style.color=HL_COLORS[0];
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  heroRotTimer=setInterval(()=>{
    if(!document.body.contains(hl)){clearInterval(heroRotTimer);heroRotTimer=null;return;}
    hl.classList.add('swap');
    setTimeout(()=>{
      if(!document.body.contains(hl))return;
      heroRotI=(heroRotI+1)%HERO_WORDS.length;
      heroColorI=(heroColorI+1)%HL_COLORS.length;
      hl.textContent=HERO_WORDS[heroRotI];
      hl.style.color=HL_COLORS[heroColorI];
      hl.classList.remove('swap');
    },420);
  },2900);
}
function homeAlbums(){
  return state.albums.filter(a=>{
    if(!state.query)return true;const q=state.query.toLowerCase();
    return (a.title||'').toLowerCase().includes(q)||(a.location||'').toLowerCase().includes(q);});
}
function renderGrid(animate){
  const grid=$('#grid');if(!grid)return;
  const albums=homeAlbums();
  const cnt=$('#albCount');if(cnt)cnt.textContent=dbReady?albums.length+' album':'';
  grid.style.display='';grid.innerHTML='';
  if(!dbReady){for(let i=0;i<8;i++)grid.appendChild(el('div','sk'));return;}
  let idx=0;
  const anim=c=>{if(animate){c.classList.add('reveal');c.style.animationDelay=Math.min(idx*45,320)+'ms';}idx++;};
  if(canAdmin()){
    const add=el('button','card','');
    add.style.cssText='border-style:dashed;display:grid;place-items:center;aspect-ratio:4/5;color:var(--muted);gap:10px;background:transparent';
    add.innerHTML=`<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span style="font-weight:600">Tạo album mới</span>`;
    add.onclick=openCreate;anim(add);grid.appendChild(add);
  }
  if(!albums.length&&!canAdmin()){
    grid.style.display='block';
    grid.appendChild(el('div','empty',`<p class="big">${state.query?'Không tìm thấy sự kiện':'Chưa có album nào'}</p><p>${state.query?'Thử từ khoá khác nhé.':'Album sẽ xuất hiện ở đây khi được đăng.'}</p>`));
    return;
  }
  albums.forEach(a=>{
    const card=el('div','card','');
    const meta=[a.location,fmtDate(a.date)].filter(Boolean).map(esc).join(' · ');
    const n=(a.photos||[]).length;
    card.innerHTML=`<div class="cover">${coverHTML(a)}<div class="scrim"></div></div>
      ${a.demo?'<span class="badge demo">DEMO</span>':''}
      <span class="cnt">${CAM.replace('1.6','2')} ${n}</span>
      <div class="cap"><h3>${esc(a.title||'Sự kiện')}</h3>
      ${meta?`<div class="meta">${meta}</div>`:''}</div>`;
    card.onclick=()=>location.hash='#/album/'+a.id;
    anim(card);grid.appendChild(card);
  });
}

let viewer={list:[],i:0,title:''};

  html+=`<button class="btn ghost" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4M12 2v13"/></svg>Chia sẻ</button>`;
  if(canAdmin()){
    html+=`<label class="btn primary" style="cursor:pointer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Tải ảnh lên<input id="upIn" type="file" accept="image/*" multiple hidden></label>`;
    html+=`<button class="btn danger" id="delAlbumBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Xóa album</button>`;
  }

      if(canAdmin()&&isReal(a.coverId)&&a.coverId===p.assetId)fig.appendChild(el('span','pcover','Ảnh bìa'));
      const acts=el('div','pactions','');
      if(cap.downloads&&isReal(p.assetId)){
        const d=el('button','pbtn','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>');
        d.title='Tải ảnh';d.onclick=e=>{e.stopPropagation();downloadOne(p,a,i);};acts.appendChild(d);
      }
      if(canAdmin()){
        if(isReal(p.assetId)){
          const c=el('button','pbtn','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="3"/></svg>');
          c.title='Đặt làm ảnh bìa';c.onclick=e=>{e.stopPropagation();setCover(a,p.assetId);};acts.appendChild(c);
        }
        const x=el('button','pbtn del','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>');
        x.title='Xóa ảnh';x.onclick=e=>{e.stopPropagation();delPhoto(a,p);};acts.appendChild(x);

    });
    const sb=$('#slideBtn');if(sb)sb.onclick=()=>{openViewer(photos,0,a.title);startSlide();};
    const da=$('#dlAllBtn');if(da)da.onclick=()=>downloadAll(a);
  }
  const share=$('#shareBtn');if(share)share.onclick=doShare;

    const up=$('#upIn');if(up)up.onchange=e=>handleUpload(a,e.target.files);
    const del=$('#delAlbumBtn');if(del)del.onclick=()=>deleteAlbum(a);
  }
  wireReviews(a);
}

/* ============ admin: create ============ */

    <p class="sub">Tạo một album rồi tải ảnh photobooth lên cho khách xem.</p>

    <div class="field"><label>Địa điểm</label><input id="fLoc" placeholder="VD: Công viên Bờ sông, HCMC"></div>
    <div class="field"><label>Ngày diễn ra</label><input id="fDate" type="date"></div>

/* ============ admin: upload ============ */
function imgDims(file){return new Promise(res=>{const u=URL.createObjectURL(file);
  const im=new Image();im.onload=()=>{res({w:im.naturalWidth,h:im.naturalHeight});URL.revokeObjectURL(u);};
  im.onerror=()=>{res({w:0,h:0});URL.revokeObjectURL(u);};im.src=u;});}
async function handleUpload(a,files){
  if(!files||!files.length)return;
  if(!cap.assets){toast('Không có quyền tải ảnh lên');return;}
  const arr=[...files].filter(f=>f.type.startsWith('image/'));
  if(!arr.length)return;
  const added=[];let done=0;setProg(0.02);
  for(const f of arr){
    try{
      const dims=await imgDims(f);
      const up=await cap.assets.upload(f);
      added.push({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        assetId:up.id,w:dims.w,h:dims.h,at:Date.now()});
    }catch(e){console.warn('upload fail',e);toast('Một ảnh tải lỗi ('+(e&&e.code||'')+')');}
    done++;setProg(done/arr.length*0.95);
  }
  if(added.length){
    const cur=(state.albumDoc&&state.albumDoc.photos)||a.photos||[];
    try{await cap.db.doc('albums/'+a.id).update({photos:[...cur,...added]});
      toast('Đã tải lên '+added.length+' ảnh');}
    catch(e){console.warn(e);toast('Lỗi lưu ảnh vào album');}
  }
  setProg(1);
}
async function setCover(a,assetId){
  try{await cap.db.doc('albums/'+a.id).update({coverId:assetId});toast('Đã đặt ảnh bìa');}
  catch(e){console.warn(e);toast('Lỗi đặt ảnh bìa');}
}
async function delPhoto(a,p){
  if(!confirm('Xóa ảnh này khỏi album?'))return;
  const cur=(state.albumDoc&&state.albumDoc.photos)||a.photos||[];
  const next=cur.filter(x=>x.id!==p.id);
  const patch={photos:next};
  if(a.coverId===p.assetId)patch.coverId=null;
  try{await cap.db.doc('albums/'+a.id).update(patch);
    if(isReal(p.assetId)&&cap.assets)cap.assets.delete(p.assetId).catch(()=>{});
    toast('Đã xóa ảnh');}
  catch(e){console.warn(e);toast('Lỗi xóa ảnh');}
}
async function deleteAlbum(a){
  if(!confirm('Xóa toàn bộ album “'+(a.title||'')+'” và ảnh bên trong?'))return;
  const photos=(state.albumDoc&&state.albumDoc.photos)||a.photos||[];
  try{
    await cap.db.doc('albums/'+a.id).delete();
    if(cap.assets)photos.forEach(p=>{if(isReal(p.assetId))cap.assets.delete(p.assetId).catch(()=>{});});
    toast('Đã xóa album');location.hash='#/';
  }catch(e){console.warn(e);toast('Lỗi xóa album');}
}

/* ============ download ============ */
async function fetchBlob(assetId){const r=await fetch(blobUrl(assetId));
  if(!r.ok)throw new Error('404');return await r.blob();}
function extOf(b){const t=b.type||'';if(t.includes('png'))return 'png';
  if(t.includes('webp'))return 'webp';if(t.includes('gif'))return 'gif';return 'jpg';}
function safe(s){return String(s||'photo').replace(/[^\w\-]+/g,'_').slice(0,40);}
async function downloadOne(p,a,i){
  if(!cap.downloads){toast('Nhấn giữ ảnh để lưu');return;}
  if(!isReal(p.assetId)){toast('Ảnh mẫu — không thể tải');return;}
  try{const b=await fetchBlob(p.assetId);
    await cap.downloads.save({filename:safe(a.title)+'-'+(i+1)+'.'+extOf(b),data:b});
  }catch(e){if(e&&e.code==='declined')return;console.warn(e);toast('Không tải được ảnh');}
}
async function downloadAll(a){
  if(!cap.downloads||!window.JSZip){toast('Tải hàng loạt không khả dụng');return;}
  const photos=((state.albumDoc&&state.albumDoc.photos)||a.photos||[]).filter(p=>isReal(p.assetId));
  if(!photos.length){toast('Album chưa có ảnh gốc');return;}
  if(photos.length>120&&!confirm('Album có '+photos.length+' ảnh, gói zip có thể lớn. Tiếp tục?'))return;
  const btn=$('#dlAllBtn');const old=btn.innerHTML;btn.disabled=true;
  const zip=new JSZip();let done=0;setProg(0.02);
  try{
    for(let i=0;i<photos.length;i++){
      try{const b=await fetchBlob(photos[i].assetId);
        zip.file(safe(a.title)+'-'+(i+1)+'.'+extOf(b),b);}catch(e){}
      done++;btn.textContent='Đang gói… '+done+'/'+photos.length;setProg(done/photos.length*0.8);
    }
    const out=await zip.generateAsync({type:'blob'},m=>setProg(0.8+m.percent/100*0.18));
    await cap.downloads.save({filename:safe(a.title)+'.zip',data:out});
    setProg(1);
  }catch(e){if(!(e&&e.code==='declined')){console.warn(e);toast('Lỗi tạo file zip');}setProg(1);}
  btn.disabled=false;btn.innerHTML=old;
}
async function doShare(){
  const url=location.href;
  try{
    if(navigator.share){await navigator.share({title:document.title,url});return;}
    await navigator.clipboard.writeText(url);toast('Đã sao chép liên kết');
  }catch(e){toast('Liên kết: '+url);}
}

/* ============ lightbox ============ */
let slideT=null;
function openViewer(list,i,title){viewer={list,i,title:title||''};
  let lb=$('#lb');
  if(!lb){lb=el('div','lb','');lb.id='lb';
    lb.innerHTML=`<div class="lb-top"><span class="n" id="lbN"></span><span class="t" id="lbT"></span>
      <button class="lb-btn" id="lbDl" title="Tải ảnh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
      <button class="lb-btn" id="lbClose" title="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="lb-stage" id="lbStage">
        <button class="lbnav prev" id="lbPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="lbnav next" id="lbNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div><div class="lb-bot" id="lbBot"></div>`;
    document.body.appendChild(lb);
    $('#lbClose',lb).onclick=closeViewer;
    $('#lbPrev',lb).onclick=()=>step(-1);
    $('#lbNext',lb).onclick=()=>step(1);
    $('#lbDl',lb).onclick=()=>{const p=viewer.list[viewer.i];downloadOne(p,{title:viewer.title},viewer.i);};
  }
  lb.style.display='flex';paintViewer();document.body.style.overflow='hidden';
}
function paintViewer(){const lb=$('#lb');if(!lb)return;const p=viewer.list[viewer.i];
  $('#lbN',lb).textContent=(viewer.i+1)+' / '+viewer.list.length;
  $('#lbT',lb).textContent=viewer.title;
  const stage=$('#lbStage',lb);
  [...stage.querySelectorAll('img,.ph')].forEach(n=>n.remove());
  const node=isReal(p.assetId)
    ?(()=>{const im=new Image();im.src=blobUrl(p.assetId);return im;})()
    :el('div','ph',CAM);
  if(!isReal(p.assetId))node.setAttribute('style',phStyle(p.id));
  stage.insertBefore(node,stage.querySelector('.next'));
  $('#lbDl',lb).style.display=(cap.downloads&&isReal(p.assetId))?'grid':'none';
}
function step(d){viewer.i=(viewer.i+d+viewer.list.length)%viewer.list.length;paintViewer();}
function startSlide(){stopSlide();slideT=setInterval(()=>step(1),2800);
  $('#lbBot').textContent='Đang trình chiếu — chạm để dừng';
  $('#lb').addEventListener('click',stopSlide,{once:true});}
function stopSlide(){if(slideT){clearInterval(slideT);slideT=null;$('#lbBot').textContent='';}}
function closeViewer(){stopSlide();const lb=$('#lb');if(lb)lb.style.display='none';
  document.body.style.overflow='';}
document.addEventListener('keydown',e=>{const lb=$('#lb');
  if(!lb||lb.style.display==='none')return;
  if(e.key==='Escape')closeViewer();else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='ArrowRight')step(1);});

/* ============ search ============ */
$('#q').addEventListener('input',e=>{state.query=e.target.value;if(!state.albumId)renderGrid(false);});

/* ============ go ============ */
boot().then(route);
</script>
